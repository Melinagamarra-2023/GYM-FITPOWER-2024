spring:
  application:
    name: fitpower
    version: 0.0.1-SNAPSHOT

  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  output:
    ansi:
      enabled: always # permite ver el log como colores

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update

  jwt:
    secret: ${SECRET_KEY}

logging:
  level:
    root: info
    org:
      springframework:
        security: TRACE